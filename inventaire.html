:root{--bg:#f4e7d3;--surface:#fbf6ec;--ink:#111;--muted:#5f5849;--line:#cdbd9f;--accent:#09604a;--orange:#de4f1b;--sand:#e9d6b3;--f-display:"Roslindale",Georgia,serif;--f-body:"ITC Avant Garde Gothic LT","Century Gothic","Segoe UI",sans-serif;--f-mono:ui-monospace,Consolas,monospace;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;-webkit-text-size-adjust:100%}
header{background:#000;padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}header img{height:26px}header b{font-family:var(--f-display);color:var(--bg);font-size:18px;font-weight:700}header span{color:#d8c9ae;font-size:12px;margin-left:auto;text-align:right}
main{padding:16px;max-width:640px;margin:0 auto}h1{font-family:var(--f-display);font-size:26px;margin:4px 0 12px}
.panel{background:var(--surface);border:1.5px solid var(--ink);padding:14px;margin-bottom:12px}
label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
input,select{font:inherit;width:100%;padding:12px;border:1.5px solid var(--ink);background:#fff;border-radius:0}
button{font:inherit;font-weight:700;padding:12px 16px;border:1.5px solid var(--ink);background:var(--bg);cursor:pointer;border-radius:0}button.p{background:var(--accent);color:var(--bg)}

.cnt{font-family:var(--f-mono);font-size:13px;color:var(--muted)}

<main>
<section id="login" class="panel"><h1>Connexion</h1><label for="em">E-mail</label><input id="em" type="email" autocapitalize="none" autocorrect="off" autocomplete="username" inputmode="email"><label for="pw">Mot de passe</label><input id="pw" type="password" autocomplete="current-password"><p class="err" id="le"></p><button class="p" id="go" style="width:100%">Se connecter</button></section>
<section id="app" hidden>
<div class="panel"><div class="row"><div><label for="ho" style="margin-top:0">Hôtel</label><select id="ho"></select></div><div><label for="mo" style="margin-top:0">Mois</label><input id="mo" type="month"></div></div><p class="hint" id="st" style="margin:8px 0 0"></p></div>
<div class="bar"><input id="q" type="search" placeholder="Rechercher un article…"><div style="display:flex;justify-content:space-between;margin-top:6px"><span class="cnt" id="cnt"></span><button id="out" style="padding:4px 10px;font-size:13px">Déconnexion</button></div></div>
<div id="list"></div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const URL_='https://cvtpylgupvoqxktpizjc.supabase.co',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN2dHB5bGd1cHZvcXhrdHBpempjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2Njc4OTksImV4cCI6MjEwNzI0Mzg5OX0.q82k1QCLCjqwuUKCfFKgqi4qrp1CmgxPHF0kyszv2tk';
const $=i=>document.getElementById(i),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sb=supabase.createClient(URL_,KEY);
const HOTELS=['Bordeaux','La Rochelle','Lille'];let prof=null,arts=[],cnt={},chan=null;
const now=new Date();$('mo').value=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
async function boot(){const {data:{session}}=await sb.auth.getSession();if(session)start();}
async function start(){
  const {data:{user}}=await sb.auth.getUser();if(!user){return}
  const {data,error}=await sb.from('profils').select('hotel,admin').eq('user_id',user.id).maybeSingle();
  if(error||!data){$('le').textContent='Compte non autorisé : demande l\'accès à l\'administrateur.';await sb.auth.signOut();return}
  prof=data;$('login').hidden=true;$('app').hidden=false;$('who').textContent=user.email;
  const list=prof.admin?HOTELS:[prof.hotel];$('ho').innerHTML=list.map(h=>'<option>'+h+'</option>').join('');
  try{const h=localStorage.getItem('inv-hotel');if(h&&list.includes(h))$('ho').value=h}catch(e){}
  load();
}
$('go').onclick=async()=>{$('le').textContent='';let r;try{r=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value})}catch(x){$('le').textContent='Connexion impossible : '+x.message;return}const {error}=r;if(error){$('le').textContent=/invalid login/i.test(error.message)?'E-mail ou mot de passe incorrect.':'Erreur : '+error.message;return}start()};
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click()});
$('out').onclick=async()=>{await sb.auth.signOut();location.reload()};
async function load(){
  const h=$('ho').value,m=$('mo').value;try{localStorage.setItem('inv-hotel',h)}catch(e){}
  $('st').textContent='Chargement…';
  const [a,c]=await Promise.all([sb.from('inventaire_articles').select('aid,name,unit,active').eq('hotel',h).eq('active',true).order('name'),sb.from('inventaire_comptages').select('aid,qty').eq('hotel',h).eq('mois',m)]);
  if(a.error||c.error){$('st').textContent='Erreur de chargement. Vérifie la connexion.';return}
  arts=a.data;cnt={};c.data.forEach(r=>cnt[r.aid]=r.qty);
  $('st').textContent=arts.length?'':'Aucun article : envoie-les depuis le hub (Paramètres > Inventaire mobile).';render();
  if(chan)sb.removeChannel(chan);
  chan=sb.channel('c-'+h+m).on('postgres_changes',{event:'*',schema:'public',table:'inventaire_comptages',filter:'hotel=eq.'+h},p=>{const r=p.new;if(r&&r.mois===m&&r.aid&&document.activeElement.dataset.a!==r.aid){cnt[r.aid]=r.qty;render()}}).subscribe();
}
function render(){const q=$('q').value.toLowerCase(),keep=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.a:null;
  const L=arts.filter(a=>!q||a.name.toLowerCase().includes(q));
  $('list').innerHTML=L.map(a=>'<div class="art'+(cnt[a.aid]!=null?' ok':'')+'" data-r="'+esc(a.aid)+'"><div class="n"><b>'+esc(a.name)+'</b><small>'+esc(a.unit||'')+'</small></div><input type="number" inputmode="decimal" step="any" min="0" data-a="'+esc(a.aid)+'" value="'+(cnt[a.aid]!=null?cnt[a.aid]:'')+'" placeholder="–"></div>').join('')||'<p class="hint">Aucun résultat.</p>';
  $('cnt').textContent=Object.keys(cnt).filter(k=>arts.some(a=>a.aid===k)).length+' / '+arts.length+' comptés';
  if(keep){const e=$('list').querySelector('[data-a="'+CSS.escape(keep)+'"]');if(e)e.focus()}}
$('list').addEventListener('change',async e=>{const t=e.target,aid=t.dataset.a;if(!aid)return;const row=t.closest('.art'),v=t.value.trim();
  if(v===''){return}const qty=parseFloat(v.replace(',','.'));if(!(qty>=0)){t.value=cnt[aid]!=null?cnt[aid]:'';return}
  row.classList.add('sv');const {error}=await sb.from('inventaire_comptages').upsert({hotel:$('ho').value,mois:$('mo').value,aid,qty,updated_at:new Date().toISOString()},{onConflict:'hotel,mois,aid'});
  row.classList.remove('sv');if(error){$('st').textContent='Échec d\'enregistrement (' +error.message+')';return}cnt[aid]=qty;$('st').textContent='';row.classList.add('ok');
  $('cnt').textContent=Object.keys(cnt).filter(k=>arts.some(a=>a.aid===k)).length+' / '+arts.length+' comptés'});
$('q').addEventListener('input',render);$('ho').onchange=load;$('mo').onchange=load;
boot();
</script></body></html>
